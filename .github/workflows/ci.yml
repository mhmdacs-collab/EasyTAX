name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pnpm version from package.json
        id: pnpm-version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const v=(p.packageManager&&String(p.packageManager).startsWith('pnpm@'))?String(p.packageManager).slice(5):p.engines?.pnpm;if(!v){process.stderr.write('pnpm version not found in package.json\n');process.exit(1)};fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\n`);"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter @easytax/web typecheck

      - name: Typecheck (api)
        run: pnpm --filter @easytax/api typecheck

      - name: Lint
        run: pnpm lint
