name: Neon migration

on:
  workflow_dispatch:
  push:
    branches: [mhmdacs-collab-phase-0-project-foundation]
    paths: [.github/workflows/neon-migrate.yml]

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migration 016
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve primary Neon connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          authorization="Authorization: Bearer ${NEON_API_KEY}"
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"

          branches="$(curl --fail --silent --show-error -H "${authorization}" "${api}/branches")"
          branch_id="$(jq -r '.branches[] | select(.primary == true) | .id' <<<"${branches}" | head -n 1)"
          test -n "${branch_id}"

          databases="$(curl --fail --silent --show-error -H "${authorization}" "${api}/branches/${branch_id}/databases")"
          database_name="$(jq -r '([.databases[] | select(.name == "neondb")][0] // .databases[0]).name' <<<"${databases}")"

          roles="$(curl --fail --silent --show-error -H "${authorization}" "${api}/branches/${branch_id}/roles")"
          role_name="$(jq -r '([.roles[] | select(.name | endswith("_owner"))][0] // .roles[0]).name' <<<"${roles}")"

          connection="$(curl --fail --silent --show-error -G -H "${authorization}" \
            --data-urlencode "branch_id=${branch_id}" \
            --data-urlencode "database_name=${database_name}" \
            --data-urlencode "role_name=${role_name}" \
            --data-urlencode "pooled=false" \
            "${api}/connection_uri")"
          database_url="$(jq -r '.uri' <<<"${connection}")"
          test -n "${database_url}"
          test "${database_url}" != "null"
          echo "::add-mask::${database_url}"
          echo "DATABASE_URL=${database_url}" >> "${GITHUB_ENV}"

      - name: Apply hidden accounting engine migration
        run: psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f apps/api/migrations/016_hidden_accounting_engine.sql

      - name: Verify hidden accounting engine schema
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.chart_of_accounts') IS NULL
              OR to_regclass('public.journal_entries') IS NULL
              OR to_regclass('public.journal_lines') IS NULL THEN
              RAISE EXCEPTION 'Hidden accounting engine migration verification failed';
            END IF;
            IF EXISTS (
              SELECT 1 FROM journal_entries je JOIN journal_lines jl ON jl.journal_entry_id=je.id
              WHERE je.status IN ('posted','reversed') GROUP BY je.id
              HAVING ABS(SUM(jl.debit)-SUM(jl.credit)) > 0.005
            ) THEN RAISE EXCEPTION 'Unbalanced journal entries found'; END IF;
          END $$;
          SQL

      - name: Diagnose purchase exclusion and payment reversal safely
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$
          DECLARE target purchase_invoices%ROWTYPE; journal_id TEXT := gen_random_uuid()::text; account_debit TEXT; account_credit TEXT; candidate BIGINT;
          BEGIN
            SELECT * INTO target FROM purchase_invoices
              WHERE status='included' AND tax_total>0 AND deleted_at IS NULL
              ORDER BY created_at DESC LIMIT 1 FOR UPDATE;
            IF target.id IS NULL THEN RAISE NOTICE 'No taxable included purchase found'; RETURN; END IF;
            SELECT next_number INTO candidate FROM journal_entry_sequences WHERE organization_id=target.organization_id FOR UPDATE;
            SELECT id INTO account_debit FROM chart_of_accounts WHERE organization_id=target.organization_id AND system_key='direct_cost';
            SELECT id INTO account_credit FROM chart_of_accounts WHERE organization_id=target.organization_id AND system_key='vat_receivable';
            INSERT INTO journal_entries(id,organization_id,entry_number,entry_date,source_type,source_id,idempotency_key,description,status)
              VALUES(journal_id,target.organization_id,'JE-'||LPAD(candidate::text,7,'0'),target.invoice_date,'purchase_tax_adjustment',target.id,
                'diagnostic:purchase-exclusion:'||journal_id,'diagnostic purchase exclusion','draft');
            INSERT INTO journal_lines(organization_id,journal_entry_id,account_id,debit,credit)
              VALUES(target.organization_id,journal_id,account_debit,target.tax_total,0),(target.organization_id,journal_id,account_credit,0,target.tax_total);
            UPDATE journal_entries SET status='posted',posted_at=NOW(),updated_at=NOW() WHERE id=journal_id;
            INSERT INTO financial_audit_events(organization_id,entity_type,entity_id,action,snapshot)
              VALUES(target.organization_id,'journal_entry',journal_id,'posted',jsonb_build_object('diagnostic',true));
            UPDATE purchase_invoices SET status='excluded',include_in_tax_return=FALSE,
              exclusion_reason='diagnostic rollback',updated_at=NOW() WHERE id=target.id;
            INSERT INTO financial_audit_events(organization_id,entity_type,entity_id,action,reason,snapshot)
              SELECT organization_id,'purchase_invoice',id,'excluded','diagnostic rollback',to_jsonb(purchase_invoices)
              FROM purchase_invoices WHERE id=target.id;
            RAISE NOTICE 'Purchase exclusion journal simulation succeeded for %',target.internal_number;
          END $$;
          ROLLBACK;

          BEGIN;
          DO $$
          DECLARE payment purchase_invoice_payments%ROWTYPE; original journal_entries%ROWTYPE; reversal_id TEXT := gen_random_uuid()::text; candidate BIGINT;
          BEGIN
            SELECT pp.* INTO payment FROM purchase_invoice_payments pp
              WHERE pp.status='issued' AND EXISTS (
                SELECT 1 FROM journal_entries je WHERE je.organization_id=pp.organization_id AND je.source_type='purchase_payment'
                  AND je.source_id=pp.id AND je.status='posted' AND je.reversal_of_entry_id IS NULL
              ) ORDER BY pp.created_at DESC LIMIT 1 FOR UPDATE;
            IF payment.id IS NULL THEN RAISE NOTICE 'No reversible purchase payment found'; RETURN; END IF;
            SELECT * INTO original FROM journal_entries WHERE organization_id=payment.organization_id AND source_type='purchase_payment'
              AND source_id=payment.id AND status='posted' AND reversal_of_entry_id IS NULL ORDER BY created_at LIMIT 1 FOR UPDATE;
            SELECT next_number INTO candidate FROM journal_entry_sequences WHERE organization_id=payment.organization_id FOR UPDATE;
            INSERT INTO journal_entries(id,organization_id,entry_number,entry_date,source_type,source_id,idempotency_key,description,status,reversal_of_entry_id)
              VALUES(reversal_id,payment.organization_id,'JE-'||LPAD(candidate::text,7,'0'),payment.payment_date,'purchase_payment',payment.id,
                'diagnostic:purchase-payment-reversal:'||reversal_id,'diagnostic payment reversal','draft',original.id);
            INSERT INTO journal_lines(organization_id,journal_entry_id,account_id,debit,credit,customer_id,supplier_reference,memo)
              SELECT organization_id,reversal_id,account_id,credit,debit,customer_id,supplier_reference,'diagnostic reversal'
              FROM journal_lines WHERE journal_entry_id=original.id;
            UPDATE journal_entries SET status='posted',posted_at=NOW(),updated_at=NOW() WHERE id=reversal_id;
            INSERT INTO financial_audit_events(organization_id,entity_type,entity_id,action,snapshot)
              VALUES(payment.organization_id,'journal_entry',reversal_id,'posted',jsonb_build_object('diagnostic',true));
            UPDATE journal_entries SET status='reversed',reversed_by_entry_id=reversal_id,reversal_reason='diagnostic rollback',updated_at=NOW() WHERE id=original.id;
            INSERT INTO financial_audit_events(organization_id,entity_type,entity_id,action,reason,snapshot)
              VALUES(payment.organization_id,'journal_entry',original.id,'reversed','diagnostic rollback',jsonb_build_object('diagnostic',true));
            UPDATE purchase_invoice_payments SET status='cancelled',cancelled_at=NOW(),cancellation_reason='diagnostic rollback',updated_at=NOW()
              WHERE id=payment.id;
            UPDATE purchase_invoices SET paid_amount=GREATEST(0,paid_amount-payment.amount),
              payment_status=CASE WHEN GREATEST(0,paid_amount-payment.amount)<=0 THEN 'unpaid'
                WHEN GREATEST(0,paid_amount-payment.amount)>=total THEN 'paid' ELSE 'partial' END,updated_at=NOW()
              WHERE id=payment.purchase_invoice_id;
            INSERT INTO financial_audit_events(organization_id,entity_type,entity_id,action,reason,snapshot)
              SELECT organization_id,'purchase_payment',id,'payment_cancelled','diagnostic rollback',to_jsonb(purchase_invoice_payments)
              FROM purchase_invoice_payments WHERE id=payment.id;
            RAISE NOTICE 'Purchase payment reversal simulation succeeded for %',payment.id;
          END $$;
          ROLLBACK;
          SQL

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript purchase action diagnostics
        run: pnpm --filter @easytax/api exec tsx src/diagnosePurchaseActions.ts
